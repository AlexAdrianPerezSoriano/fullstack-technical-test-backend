version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: ticket_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ticket_db
      MYSQL_USER: ticket_user
      MYSQL_PASSWORD: ticket_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: .
    container_name: ticket_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ticket_user
      DB_PASSWORD: ticket_pass
      DB_NAME: ticket_db
      JWT_SECRET: mi-secreto-super-seguro
      PORT: 5000
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  db_data:
